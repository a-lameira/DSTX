name: Build & Deploy Flatpak Repository (GitHub Pages)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Required to push to gh-pages branch

    steps:
      - uses: actions/checkout@v4

      # Import GPG private key and configure batch/pinentry mode
      - name: Import GPG key and setup batch mode
        run: |
          # Import the private key
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

          # Configure GPG to avoid interactive pinentry
          mkdir -p ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "batch" >> ~/.gnupg/gpg.conf
          chmod 600 ~/.gnupg/gpg.conf

          # Reload gpg-agent to apply changes
          gpg-connect-agent reloadagent /bye

      # Cache the GPG passphrase by performing a dummy signing operation
      - name: Cache GPG passphrase
        run: |
          # Write passphrase to a temporary file
          echo "${{ secrets.GPG_PASSPHRASE }}" > /tmp/passphrase.txt
          # Perform a dummy sign – this caches the passphrase in the agent
          gpg --batch --passphrase-file /tmp/passphrase.txt --sign --output /dev/null /dev/null

      - name: Install flatpak-builder and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Build static core
        run: |
          chmod +x build/build-core-static.sh
          ./build/build-core-static.sh

      # Build and sign the Flatpak repository in one step (more reliable)
      - name: Build and sign Flatpak repository
        id: build_repo
        run: |
          set -e
          MANIFEST="build/flatpak/org.dstx.gui.yml"
          REPO_DIR="$GITHUB_WORKSPACE/dstx-flatpak-repo"
          BUILD_DIR="$GITHUB_WORKSPACE/flatpak-build"

          # Automatically detect GPG key ID
          GPG_KEY=$(gpg --list-secret-keys --keyid-format LONG dstx@dstxapp.org | grep 'sec' | awk '{print $2}' | cut -d'/' -f2)
          if [ -z "$GPG_KEY" ]; then
            echo "ERROR: GPG key not found for dstx@dstxapp.org"
            exit 1
          fi
          echo "Using GPG key: $GPG_KEY"

          # Copy static binaries to the location expected by the Flatpak manifest
          mkdir -p build/flatpak/static
          cp build/core-static/dstx build/flatpak/static/
          cp build/core-static/dstx-dbus build/flatpak/static/

          rm -rf "$REPO_DIR" "$BUILD_DIR"

          # Build and sign the repository in a single command
          # This ensures the commit is signed immediately
          flatpak-builder --force-clean \
                          --repo="$REPO_DIR" \
                          --gpg-sign="$GPG_KEY" \
                          --gpg-homedir="$HOME/.gnupg" \
                          "$BUILD_DIR" \
                          "$MANIFEST"

          # Update repository metadata (preserves signature)
          flatpak build-update-repo --gpg-sign="$GPG_KEY" "$REPO_DIR"

          # Copy the public key into the repository directory (web accessible)
          gpg --armor --export dstx@dstxapp.org > "$REPO_DIR"/dstx-flatpak-repo.asc

          echo "repo_dir=$REPO_DIR" >> $GITHUB_OUTPUT

      - name: Prepare gh-pages content
        run: |
          mkdir -p gh-pages-temp/flatpak
          cp -r ${{ steps.build_repo.outputs.repo_dir }}/* gh-pages-temp/flatpak/
          # Ensure the CNAME file exists at root (will be preserved by keep_files)
          echo "flatpak.dstxapp.org" > gh-pages-temp/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-temp
          publish_branch: gh-pages
          keep_files: true          # Preserve existing files like CNAME and apt/ folder
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Flatpak repository for ${{ github.ref_name }}'
