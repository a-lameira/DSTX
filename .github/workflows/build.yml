name: Build DSTX packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-core-static:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag or default
        id: set-version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > VERSION

      - name: Build static core (Alpine)
        run: |
          chmod +x build/build-core-static.sh
          ./build/build-core-static.sh

      - name: Upload core-static artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Upload VERSION file
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: VERSION

  build-flatpak:
    needs: build-core-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y org.gnome.Sdk//46 org.gnome.Platform//49

      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Build Flatpak bundle
        run: |
          chmod +x build/build-flatpak.sh
          ./build/build-flatpak.sh

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: dstx-flatpak
          path: build/flatpak-bundle/*.flatpak

  build-deb:
    needs: build-core-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create VERSION file
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "${GITHUB_REF_NAME#v}" > VERSION
          else
            echo "0.0.0-dev" > VERSION
          fi

      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Build Debian package
        run: |
          chmod +x build/build-deb.sh
          ./build/build-deb.sh

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: dstx-deb
          path: build/deb/*.deb

  build-rpm:
    needs: build-core-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create VERSION file
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "${GITHUB_REF_NAME#v}" > VERSION
          else
            echo "0.0.0-dev" > VERSION
          fi

      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Build RPM package
        run: |
          chmod +x build/build-rpm.sh
          ./build/build-rpm.sh

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: dstx-rpm
          path: build/rpm/*.rpm

  build-tar:
    needs: build-core-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build valac gettext \
               libgtk-4-dev libadwaita-1-dev libgee-0.8-dev \
               libjson-glib-dev librsvg2-dev

      - name: Create VERSION file
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "${GITHUB_REF_NAME#v}" > VERSION
          else
            echo "0.0.0-dev" > VERSION
          fi

      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Build tarball
        run: |
          chmod +x build/build-tar.sh
          ./build/build-tar.sh

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dstx-tar
          path: build/tar/*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build-flatpak, build-deb, build-rpm, build-tar]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/dstx-flatpak/*
            artifacts/dstx-deb/*
            artifacts/dstx-rpm/*
            artifacts/dstx-tar/*
          generate_release_notes: true
