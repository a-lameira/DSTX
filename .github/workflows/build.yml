name: Build DSTX packages

on:
  push:
    tags:
      - 'v*'               # executa ao criar tag como v0.1.0
  workflow_dispatch:       # permite execução manual

jobs:
  # 1. Compila core estático (uma vez)
  build-core-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" > VERSION

      - name: Build static core
        run: |
          chmod +x build-infra/build-core-static.sh
          ./build-infra/build-core-static.sh

      - name: Upload core-static artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-static
          path: build/core-static/

  # 2. Flatpak
  build-flatpak:
    runs-on: ubuntu-latest
    needs: build-core-static
    steps:
      - uses: actions/checkout@v4
      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/
      - name: Build Flatpak
        run: |
          chmod +x build-infra/build-flatpak.sh
          ./build-infra/build-flatpak.sh
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: dstx-flatpak
          path: build/flatpak-bundle/dstx-gui.flatpak

  # 3. Debian (.deb)
  build-deb:
    runs-on: ubuntu-latest
    needs: build-core-static
    steps:
      - uses: actions/checkout@v4
      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/
      - name: Build Debian package
        run: |
          chmod +x build-infra/build-deb.sh
          ./build-infra/build-deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: dstx-deb
          path: build/deb/*.deb

  # 4. Fedora (.rpm)
  build-rpm:
    runs-on: ubuntu-latest
    needs: build-core-static
    steps:
      - uses: actions/checkout@v4
      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/
      - name: Build RPM
        run: |
          chmod +x build-infra/build-rpm.sh
          ./build-infra/build-rpm.sh
      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: dstx-rpm
          path: build/rpm/*.rpm

  # 5. Tarball
  build-tar:
    runs-on: ubuntu-latest
    needs: build-core-static
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (for GUI compilation)
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgtk-4-dev libadwaita-1-dev \
               libgee-0.8-dev libjson-glib-dev librsvg2-dev
      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/
      - name: Build tarball
        run: |
          chmod +x build-infra/build-tar.sh
          ./build-infra/build-tar.sh
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dstx-tar
          path: build/tar/*.tar.gz

  # 6. Criar release no GitHub e anexar todos os artefatos
  release:
    runs-on: ubuntu-latest
    needs: [build-flatpak, build-deb, build-rpm, build-tar]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/dstx-flatpak/*
            artifacts/dstx-deb/*
            artifacts/dstx-rpm/*
            artifacts/dstx-tar/*
          generate_release_notes: true
