# .github/workflows/build.yml
name: Build DSTX packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # 0. Build cached AppImage builder
  # --------------------------------------------------------------------------
  build-appimage-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AppImage builder image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/containers/appimage-builder.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/appimage-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # --------------------------------------------------------------------------
  # 1. Build static core (common for all packages)
  # --------------------------------------------------------------------------
  build-core-static:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag or default
        id: set-version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > VERSION

      - name: Build static core (Alpine)
        run: |
          chmod +x build/build-core-static.sh
          ./build/build-core-static.sh

      - name: Upload core-static artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Upload VERSION file
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: VERSION

  # --------------------------------------------------------------------------
  # 2. Flatpak – complete package (core + GUI)
  # --------------------------------------------------------------------------
  build-flatpak:
    needs: build-core-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder and SDK (GNOME 49)
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Build Flatpak bundle
        run: |
          chmod +x build/build-flatpak.sh
          ./build/build-flatpak.sh

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: dstx-flatpak
          path: build/flatpak-bundle/*.flatpak

  # --------------------------------------------------------------------------
  # 3. Debian package – core only (no GUI)
  # --------------------------------------------------------------------------
  build-deb:
    needs: build-core-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download VERSION file
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: ./

      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Build Debian package (core only)
        run: |
          chmod +x build/build-deb.sh
          ./build/build-deb.sh

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: dstx-deb
          path: build/deb/*.deb

  # --------------------------------------------------------------------------
  # 4. RPM package – core only (no GUI)
  # --------------------------------------------------------------------------
  build-rpm:
    needs: build-core-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download VERSION file
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: ./

      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Build RPM package (core only)
        run: |
          chmod +x build/build-rpm.sh
          ./build/build-rpm.sh

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: dstx-rpm
          path: build/rpm/*.rpm

  # --------------------------------------------------------------------------
  # 5. Tarball – core only (no GUI)
  # --------------------------------------------------------------------------
  build-tar:
    needs: build-core-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download VERSION file
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: ./

      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Build tarball (core only)
        run: |
          chmod +x build/build-tar.sh
          ./build/build-tar.sh

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dstx-tar
          path: build/tar/*.tar.gz

  # --------------------------------------------------------------------------
  # 6. AppImage – GUI only (requires recent GTK/libadwaita)
  # --------------------------------------------------------------------------
  build-appimage:
    needs: [build-core-static, build-appimage-builder]   # wait for core and builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download core-static
        uses: actions/download-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Build AppImage using custom builder
        run: |
          chmod +x build/build-appimage.sh
          ./build/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: dstx-appimage
          path: build/appimage/*.AppImage

  # --------------------------------------------------------------------------
  # 7. GitHub Release – attach all artifacts
  # --------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build-flatpak, build-deb, build-rpm, build-tar, build-appimage]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/dstx-flatpak/*
            artifacts/dstx-deb/*
            artifacts/dstx-rpm/*
            artifacts/dstx-tar/*
            artifacts/dstx-appimage/*
          generate_release_notes: true
