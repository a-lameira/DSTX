name: Build DSTX Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty to auto-detect)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "$VERSION" > VERSION

      # NOVO: construir os binários estáticos do core (dstx, dstx-dbus)
      - name: Build static core
        run: |
          chmod +x build/build-core-static.sh
          ./build/build-core-static.sh

      - name: Install flatpak-builder and SDK (GNOME 49)
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Build Flatpak bundle
        run: |
          chmod +x build/build-flatpak.sh
          ./build/build-flatpak.sh

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: dstx-flatpak
          path: build/flatpak-bundle/*.flatpak
