name: Build DSTX Tarball

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty to auto-detect)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-tar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "$VERSION" > VERSION

      - name: Build static core (required for binaries)
        run: |
          chmod +x build/build-core-static.sh
          ./build/build-core-static.sh

      - name: Build tarball
        run: |
          chmod +x build/build-tar.sh
          ./build/build-tar.sh

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dstx-tar
          path: build/tar/*.tar.gz
