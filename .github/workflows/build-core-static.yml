name: Build DSTX Core (Static)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty to auto-detect from tag or use "0.0.0-dev")'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-core-static:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: set-version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > VERSION

      - name: Build static core
        run: |
          chmod +x build/build-core-static.sh
          ./build/build-core-static.sh

      - name: Upload core-static artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-static
          path: build/core-static/

      - name: Upload VERSION file
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: VERSION
