app-id: org.dstx.gui
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: dstx-gui

finish-args:
  - --system-talk-name=org.dstx.Bridge
  - --system-talk-name=org.freedesktop.PolicyKit1
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=~/.config/dstx:create
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

modules:
  # Core Module (C) - static binaries
  - name: dstx-core-static
    buildsystem: simple
    build-commands:
      - install -Dm755 dstx /app/bin/dstx
      - install -Dm755 dstx-dbus /app/bin/dstx-dbus
    sources:
      - type: dir
        path: static

  # Translations (.mo)
  - name: dstx-locale
    buildsystem: simple
    build-commands:
      - for lang in pt_BR es_ES fr de it ru; do
          msgfmt -o $lang.mo po/$lang.po;
          install -Dm644 $lang.mo /app/share/locale/$lang/LC_MESSAGES/dstx-gui.mo;
        done
    sources:
      - type: dir
        path: ../../dstx-gui

  # GUI Module (Vala)
  - name: dstx-gui
    buildsystem: meson
    config-opts:
      - -Dflatpak=true
    sources:
      - type: dir
        path: ../../dstx-gui
